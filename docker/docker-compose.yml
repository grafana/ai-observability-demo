version: '3.8'

services:
  demo-app:
    build: .
    environment:
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT}
      - OTEL_EXPORTER_OTLP_HEADERS=${OTEL_EXPORTER_OTLP_HEADERS}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    volumes:
      - ./app.py:/app/app.py
    restart: unless-stopped 
